name: Build and Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ArpExcel-VST3-macOS
          path: build/ArpExcel_artefacts/Release/VST3/ArpExcel.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: ArpExcel-AU-macOS
          path: build/ArpExcel_artefacts/Release/AU/ArpExcel.component

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ArpExcel-VST3-Windows
          path: build/ArpExcel_artefacts/Release/VST3/ArpExcel.vst3

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ArpExcel v${{ github.run_number }}
          files: |
            artifacts/ArpExcel-VST3-macOS/ArpExcel.vst3
            artifacts/ArpExcel-AU-macOS/ArpExcel.component
            artifacts/ArpExcel-VST3-Windows/ArpExcel.vst3
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
