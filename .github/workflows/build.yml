name: Build and Release

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Midisheet_artefacts/Release/AU/Midisheet.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumi Mdsh Mids

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Midisheet-VST3-macOS
          path: build/Midisheet_artefacts/Release/VST3/Midisheet.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Midisheet-AU-macOS
          path: build/Midisheet_artefacts/Release/AU/Midisheet.component

  release-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Midisheet-*-macOS
          merge-multiple: true

      - name: Create macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ github.run_number }}
          name: Midisheet macOS v${{ github.run_number }}
          files: |
            artifacts/Midisheet.vst3
            artifacts/Midisheet.component
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Midisheet-VST3-Windows
          path: build/Midisheet_artefacts/Release/VST3/Midisheet.vst3

  release-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Midisheet-VST3-Windows
          merge-multiple: true

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ github.run_number }}
          name: Midisheet Windows v${{ github.run_number }}
          files: |
            artifacts/Midisheet.vst3
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
